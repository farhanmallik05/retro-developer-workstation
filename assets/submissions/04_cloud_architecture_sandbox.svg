    <text x="25" y="445" fill="#38bdf8" font-size="10" font-weight="bold">💡 Pro Tip:</text>
    <text x="25" y="465" fill="#94a3b8" font-size="9">Drag from output pins to input pins</text>
    <text x="25" y="480" fill="#94a3b8" font-size="9">to create encrypted AWS data flows.</text>
  </g>

  <!-- Main Blueprint Canvas Area -->
  <g transform="translate(300, 110)">
