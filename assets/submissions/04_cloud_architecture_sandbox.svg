    <path d="M 120,180 C 180,180 200,270 280,270" fill="none" stroke="#10b981" stroke-width="2.5" />
    <path d="M 390,270 C 430,270 450,270 480,270" fill="none" stroke="#10b981" stroke-width="2.5" />
    <path d="M 590,270 C 630,270 650,200 680,200" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <path d="M 590,270 C 630,270 650,340 680,340" fill="none" stroke="#ec4899" stroke-width="2.5" />

    <!-- Node 1: Global Edge / CloudFront (Placed Node) -->
    <g transform="translate(20, 140)" filter="url(#shadow)">
      <rect x="0" y="0" width="110" height="85" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="55" y="32" fill="#38bdf8" font-size="20" text-anchor="middle">🌐</text>
      <text x="55" y="55" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">CloudFront</text>
      <text x="55" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">Global POPs</text>
      <!-- Output pin -->
      <circle cx="110" cy="42" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Node 2: S3 Static Web Assets -->
    <g transform="translate(280, 60)" filter="url(#shadow)">
      <rect x="0" y="0" width="110" height="85" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
      <text x="55" y="32" fill="#22c55e" font-size="20" text-anchor="middle">🪣</text>
      <text x="55" y="55" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">S3 Bucket</text>
      <text x="55" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">React 18 SPA</text>
      <!-- Input pin -->
      <circle cx="0" cy="42" r="5" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Node 3: API Gateway -->
    <g transform="translate(280, 230)" filter="url(#shadow)">
      <rect x="0" y="0" width="110" height="85" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="55" y="32" fill="#06b6d4" font-size="20" text-anchor="middle">🚪</text>
      <text x="55" y="55" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">API Gateway</text>
      <text x="55" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">REST HTTP API</text>
      <!-- Input and Output pins -->
      <circle cx="0" cy="42" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="110" cy="42" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Node 4: Lambda Compute -->
    <g transform="translate(480, 230)" filter="url(#shadow)">
      <rect x="0" y="0" width="110" height="85" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="55" y="32" fill="#f59e0b" font-size="20" text-anchor="middle">⚡</text>
      <text x="55" y="55" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Lambda Fn</text>
      <text x="55" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">Node 20 runtime</text>
      <circle cx="0" cy="42" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="110" cy="42" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Node 5: DynamoDB -->
    <g transform="translate(680, 160)" filter="url(#shadow)">
      <rect x="0" y="0" width="120" height="85" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="60" y="32" fill="#3b82f6" font-size="20" text-anchor="middle">🗄️</text>
      <text x="60" y="55" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">DynamoDB</text>
      <text x="60" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">Telemetry &amp; Inquiries</text>
      <circle cx="0" cy="42" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Node 6: Bedrock Claude Haiku -->
    <g transform="translate(680, 300)" filter="url(#shadow)">
      <rect x="0" y="0" width="120" height="85" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="60" y="32" fill="#ec4899" font-size="20" text-anchor="middle">🤖</text>
      <text x="60" y="55" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Bedrock Haiku</text>
      <text x="60" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">AI Twin Knowledge</text>
      <circle cx="0" cy="42" r="5" fill="#ec4899" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Live Cost & Estimation Panel Bottom -->
    <g transform="translate(20, 420)" filter="url(#shadow)">
      <rect x="0" y="0" width="810" height="100" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />

      <g transform="translate(30, 25)">
        <text x="0" y="15" fill="#94a3b8" font-size="11">ESTIMATED MONTHLY COST (10,000 VISITORS)</text>
        <text x="0" y="48" fill="#22c55e" font-size="30" font-weight="bold">$1.24 <tspan fill="#64748b" font-size="14" font-weight="normal">/ month</tspan></text>
        <text x="0" y="65" fill="#38bdf8" font-size="10">✓ Eligible for AWS Free Tier (1M free requests/mo on Lambda)</text>
      </g>

      <line x1="420" y1="15" x2="420" y2="85" stroke="#1e293b" />

      <g transform="translate(450, 25)">
        <text x="0" y="15" fill="#94a3b8" font-size="11">WELL-ARCHITECTED PILLARS</text>
        <text x="0" y="38" fill="#e2e8f0" font-size="11">⚡ <tspan font-weight="bold">Performance Efficiency:</tspan> 98/100 (CloudFront Cache)</text>
        <text x="0" y="56" fill="#e2e8f0" font-size="11">🛡️ <tspan font-weight="bold">Security:</tspan> 95/100 (IAM Least Privilege &amp; HTTPS)</text>
        <text x="0" y="74" fill="#e2e8f0" font-size="11">💰 <tspan font-weight="bold">Cost Optimization:</tspan> 100/100 (Serverless Pay-Per-Use)</text>
      </g>
    </g>
  </g>
</svg>

