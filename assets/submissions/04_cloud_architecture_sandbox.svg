<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#020617;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#020617" />

  <!-- Background Canvas Grid Pattern -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.6">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350 M 0,400 L 1200,400 M 0,450 L 1200,450 M 0,500 L 1200,500 M 0,550 L 1200,550 M 0,600 L 1200,600 M 0,650 L 1200,650" />
    <path d="M 50,0 L 50,675 M 100,0 L 100,675 M 150,0 L 150,675 M 200,0 L 200,675 M 250,0 L 250,675 M 300,0 L 300,675 M 350,0 L 350,675 M 400,0 L 400,675 M 450,0 L 450,675 M 500,0 L 500,675 M 550,0 L 550,675 M 600,0 L 600,675 M 650,0 L 650,675 M 700,0 L 700,675 M 750,0 L 750,675 M 800,0 L 800,675 M 850,0 L 850,675 M 900,0 L 900,675 M 950,0 L 950,675 M 1000,0 L 1000,675 M 1050,0 L 1050,675 M 1100,0 L 1100,675 M 1150,0 L 1150,675" />
  </g>

  <!-- Top Tool Header -->
  <g transform="translate(60, 30)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="60" rx="14" fill="#0f172a" stroke="#1e293b" />
    
    <text x="30" y="36" fill="#38bdf8" font-size="18" font-weight="bold">📐 Cloud Architecture Sandbox</text>
    <text x="340" y="36" fill="#64748b" font-size="12">Drag AWS components • Connect routes • Validate against Well-Architected Framework</text>

    <!-- Blueprint Validation Badge -->
    <rect x="910" y="14" width="145" height="32" rx="8" fill="#064e3b" stroke="#059669" />
    <text x="982" y="34" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">✓ Well-Architected: 96%</text>
  </g>

  <!-- Left Component Palette -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="520" rx="14" fill="#0b1120" stroke="#1e293b" />
    <text x="20" y="32" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">AWS SERVICE PALETTE</text>

    <!-- Draggable Services -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="190" height="48" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="24" r="14" fill="#818cf8" fill-opacity="0.2" />
      <text x="25" y="30" fill="#818cf8" font-size="14" text-anchor="middle">🌐</text>
      <text x="50" y="24" fill="#f8fafc" font-size="12" font-weight="bold">CloudFront CDN</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">Edge Caching</text>
    </g>

    <g transform="translate(15, 110)">
      <rect x="0" y="0" width="190" height="48" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="24" r="14" fill="#22c55e" fill-opacity="0.2" />
      <text x="25" y="30" fill="#22c55e" font-size="14" text-anchor="middle">🪣</text>
      <text x="50" y="24" fill="#f8fafc" font-size="12" font-weight="bold">Amazon S3</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">Object Storage</text>
    </g>

    <g transform="translate(15, 170)">
      <rect x="0" y="0" width="190" height="48" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="24" r="14" fill="#f59e0b" fill-opacity="0.2" />
      <text x="25" y="30" fill="#f59e0b" font-size="14" text-anchor="middle">⚡</text>
      <text x="50" y="24" fill="#f8fafc" font-size="12" font-weight="bold">AWS Lambda</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">Serverless Compute</text>
    </g>

    <g transform="translate(15, 230)">
      <rect x="0" y="0" width="190" height="48" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="24" r="14" fill="#06b6d4" fill-opacity="0.2" />
      <text x="25" y="30" fill="#06b6d4" font-size="14" text-anchor="middle">🚪</text>
      <text x="50" y="24" fill="#f8fafc" font-size="12" font-weight="bold">API Gateway</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">REST &amp; WebSocket</text>
    </g>

    <g transform="translate(15, 290)">
      <rect x="0" y="0" width="190" height="48" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="24" r="14" fill="#3b82f6" fill-opacity="0.2" />
      <text x="25" y="30" fill="#3b82f6" font-size="14" text-anchor="middle">🗄️</text>
      <text x="50" y="24" fill="#f8fafc" font-size="12" font-weight="bold">Amazon DynamoDB</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">NoSQL Database</text>
    </g>

    <g transform="translate(15, 350)">
      <rect x="0" y="0" width="190" height="48" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="24" r="14" fill="#ec4899" fill-opacity="0.2" />
      <text x="25" y="30" fill="#ec4899" font-size="14" text-anchor="middle">🤖</text>
      <text x="50" y="24" fill="#f8fafc" font-size="12" font-weight="bold">Amazon Bedrock</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">Foundation Models</text>
    </g>

    <!-- Canvas instructions -->
