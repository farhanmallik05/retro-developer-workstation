<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#020617;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="hudBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#020617" />

  <!-- Ambient light -->
  <circle cx="250" cy="200" r="250" fill="#10b981" fill-opacity="0.04" />
  <circle cx="950" cy="450" r="280" fill="#06b6d4" fill-opacity="0.05" />

  <!-- Top Status Bar -->
  <g transform="translate(60, 30)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="60" rx="14" fill="#0f172a" stroke="#1e293b" />
    
    <circle cx="35" cy="30" r="6" fill="#10b981" />
    <text x="55" y="36" fill="#f8fafc" font-size="16" font-weight="bold">AWS Live Telemetry &amp; SRE Observability HUD</text>
    <text x="490" y="36" fill="#64748b" font-size="12">Region: us-east-1 (N. Virginia) • Production Stage</text>

    <!-- Amplify Pipeline status -->
    <rect x="880" y="14" width="175" height="32" rx="8" fill="#064e3b" stroke="#059669" />
    <text x="967" y="34" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">⚡ Amplify: Deployed #84</text>
  </g>

  <!-- Metric Card 1: Global Visitor Counter (DynamoDB Atomic Incr) -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="150" rx="14" fill="url(#hudBg)" stroke="#1e293b" />
    <text x="24" y="35" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">DYNAMODB ATOMIC COUNTER</text>
    <text x="24" y="80" fill="#f8fafc" font-size="34" font-weight="bold">14,289</text>
    <text x="24" y="105" fill="#10b981" font-size="12">▲ +1,420 this week</text>
    <text x="24" y="130" fill="#64748b" font-size="10">Strong consistency • 0 lock contention</text>
  </g>

  <!-- Metric Card 2: CloudFront Cache Hit Ratio -->
  <g transform="translate(335, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="150" rx="14" fill="url(#hudBg)" stroke="#1e293b" />
    <text x="24" y="35" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">CLOUDFRONT CACHE HIT</text>
    <text x="24" y="80" fill="#38bdf8" font-size="34" font-weight="bold">98.4%</text>
    <text x="24" y="105" fill="#38bdf8" font-size="12">Edge TTL: 86,400s (24h)</text>
    <text x="24" y="130" fill="#64748b" font-size="10">450+ Points of Presence globally</text>
  </g>

  <!-- Metric Card 3: Lambda Invocation P99 Latency -->
  <g transform="translate(610, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="150" rx="14" fill="url(#hudBg)" stroke="#1e293b" />
    <text x="24" y="35" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">LAMBDA COLD START / P99</text>
    <text x="24" y="80" fill="#a855f7" font-size="34" font-weight="bold">42 ms</text>
    <text x="24" y="105" fill="#a855f7" font-size="12">Node 20 • SnapStart enabled</text>
    <text x="24" y="130" fill="#64748b" font-size="10">Warm latency: 12ms flat</text>
  </g>

  <!-- Metric Card 4: Error Rate -->
  <g transform="translate(885, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="255" height="150" rx="14" fill="url(#hudBg)" stroke="#1e293b" />
    <text x="24" y="35" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">5XX HTTP ERROR RATE</text>
    <text x="24" y="80" fill="#10b981" font-size="34" font-weight="bold">0.00%</text>
    <text x="24" y="105" fill="#10b981" font-size="12">100% Availability SLA</text>
    <text x="24" y="130" fill="#64748b" font-size="10">CloudWatch Alarms: OK</text>
  </g>

  <!-- Middle Left: Global Edge Latency Distribution Chart -->
  <g transform="translate(60, 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="600" height="350" rx="14" fill="url(#hudBg)" stroke="#1e293b" />
    
    <text x="24" y="35" fill="#f8fafc" font-size="14" font-weight="bold">Global Edge Response Times (CloudFront POPs)</text>
    <text x="24" y="55" fill="#64748b" font-size="11">Real user monitoring across 6 international edge regions</text>

    <!-- Bar Chart Rows -->
    <!-- Region 1: US East (N. Virginia) -->
    <g transform="translate(24, 80)">
      <text x="0" y="16" fill="#94a3b8" font-size="12" font-family="monospace">iad-pop (US-East):</text>
      <rect x="180" y="4" width="70" height="18" rx="4" fill="#10b981" />
      <text x="260" y="18" fill="#cbd5e1" font-size="11" font-weight="bold">14 ms</text>
    </g>

    <!-- Region 2: US West (Oregon) -->
    <g transform="translate(24, 120)">
      <text x="0" y="16" fill="#94a3b8" font-size="12" font-family="monospace">pdx-pop (US-West):</text>
      <rect x="180" y="4" width="110" height="18" rx="4" fill="#10b981" />
      <text x="300" y="18" fill="#cbd5e1" font-size="11" font-weight="bold">22 ms</text>
    </g>

    <!-- Region 3: Europe (Frankfurt) -->
    <g transform="translate(24, 160)">
      <text x="0" y="16" fill="#94a3b8" font-size="12" font-family="monospace">fra-pop (EU-Central):</text>
      <rect x="180" y="4" width="170" height="18" rx="4" fill="#38bdf8" />
      <text x="360" y="18" fill="#cbd5e1" font-size="11" font-weight="bold">34 ms</text>
    </g>

    <!-- Region 4: Asia Pacific (Tokyo) -->
    <g transform="translate(24, 200)">
      <text x="0" y="16" fill="#94a3b8" font-size="12" font-family="monospace">nrt-pop (AP-Northeast):</text>
      <rect x="180" y="4" width="225" height="18" rx="4" fill="#38bdf8" />
      <text x="415" y="18" fill="#cbd5e1" font-size="11" font-weight="bold">45 ms</text>
    </g>

    <!-- Region 5: Asia Pacific (Singapore) -->
    <g transform="translate(24, 240)">
      <text x="0" y="16" fill="#94a3b8" font-size="12" font-family="monospace">sin-pop (AP-Southeast):</text>
      <rect x="180" y="4" width="260" height="18" rx="4" fill="#f59e0b" />
      <text x="450" y="18" fill="#cbd5e1" font-size="11" font-weight="bold">52 ms</text>
    </g>

    <!-- Region 6: South America (São Paulo) -->
    <g transform="translate(24, 280)">
      <text x="0" y="16" fill="#94a3b8" font-size="12" font-family="monospace">gru-pop (SA-East):</text>
      <rect x="180" y="4" width="310" height="18" rx="4" fill="#f59e0b" />
      <text x="500" y="18" fill="#cbd5e1" font-size="11" font-weight="bold">62 ms</text>
    </g>

    <text x="24" y="330" fill="#10b981" font-size="11">✓ 100% of global requests served in under 70ms due to edge CDN cache</text>
  </g>

  <!-- Middle Right: AWS Amplify CI/CD Git Deployment Log -->
  <g transform="translate(680, 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="460" height="350" rx="14" fill="url(#hudBg)" stroke="#1e293b" />
    
    <text x="24" y="35" fill="#f8fafc" font-size="14" font-weight="bold">Amplify Gen 2 Deployment Pipeline</text>
    <text x="24" y="55" fill="#64748b" font-size="11">Automated branch builds from GitHub @main</text>

    <!-- Pipeline steps -->
    <g transform="translate(24, 80)">
      <!-- Step 1 -->
      <circle cx="12" cy="12" r="10" fill="#064e3b" stroke="#10b981" />
      <text x="12" y="16" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">✓</text>
      <text x="35" y="16" fill="#f8fafc" font-size="12" font-weight="bold">Provision Compute Container</text>
      <text x="380" y="16" fill="#64748b" font-size="11">12s</text>

      <line x1="12" y1="24" x2="12" y2="48" stroke="#10b981" stroke-width="2" />

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="12" cy="12" r="10" fill="#064e3b" stroke="#10b981" />
        <text x="12" y="16" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">✓</text>
        <text x="35" y="16" fill="#f8fafc" font-size="12" font-weight="bold">npm run build (Vite + TypeScript)</text>
        <text x="380" y="16" fill="#64748b" font-size="11">24s</text>
      </g>

      <line x1="12" y1="72" x2="12" y2="96" stroke="#10b981" stroke-width="2" />

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="12" cy="12" r="10" fill="#064e3b" stroke="#10b981" />
        <text x="12" y="16" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">✓</text>
        <text x="35" y="16" fill="#f8fafc" font-size="12" font-weight="bold">Execute Automated Unit Test Suite</text>
        <text x="380" y="16" fill="#64748b" font-size="11">4s</text>
      </g>

      <line x1="12" y1="120" x2="12" y2="144" stroke="#10b981" stroke-width="2" />

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <circle cx="12" cy="12" r="10" fill="#064e3b" stroke="#10b981" />
        <text x="12" y="16" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">✓</text>
        <text x="35" y="16" fill="#f8fafc" font-size="12" font-weight="bold">Sync S3 Origin &amp; Invalidate CDN</text>
        <text x="380" y="16" fill="#64748b" font-size="11">15s</text>
      </g>
    </g>

    <!-- Verification summary card -->
    <g transform="translate(24, 255)">
      <rect x="0" y="0" width="412" height="65" rx="8" fill="#042f2e" stroke="#0d9488" />
      <text x="15" y="24" fill="#5eead4" font-size="11" font-weight="bold">DEPLOYMENT STATUS: HEALTHY &amp; LIVE</text>
      <text x="15" y="44" fill="#ccfbf1" font-size="10">Amplify Domain: https://main.d309xkm39z91.amplifyapp.com</text>
      <text x="15" y="58" fill="#99f6e4" font-size="9">Commit: 7f83b2a • "feat(iter-6): add cloud particle canvas &amp; test suite"</text>
    </g>
  </g>
</svg>

