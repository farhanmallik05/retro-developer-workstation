<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#020617;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#020617" />
  <circle cx="200" cy="180" r="280" fill="#06b6d4" fill-opacity="0.05" />
  <circle cx="1000" cy="500" r="300" fill="#a855f7" fill-opacity="0.05" />

  <!-- Terminal Window Frame -->
  <g transform="translate(60, 40)" filter="url(#glow)">
    <!-- Outer Border & Glow -->
    <rect x="0" y="0" width="1080" height="595" rx="16" fill="url(#termBg)" stroke="#334155" stroke-width="1.5" />

    <!-- Window Title Bar -->
    <rect x="0" y="0" width="1080" height="42" rx="16" fill="url(#headerGrad)" />
    <rect x="0" y="30" width="1080" height="12" fill="url(#headerGrad)" />
    <line x1="0" y1="42" x2="1080" y2="42" stroke="#1e293b" stroke-width="1" />

    <!-- Window Buttons -->
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#eab308" />
    <circle cx="64" cy="21" r="6" fill="#22c55e" />

    <!-- Title Centered -->
    <text x="540" y="26" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">farhan@aws-cloud-shell: ~/portfolio (zsh)</text>

    <!-- Branch Tag Right -->
    <rect x="940" y="10" width="115" height="22" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1" />
    <text x="997" y="25" fill="#38bdf8" font-size="10" text-anchor="middle">git:(main) [ok]</text>

    <!-- Terminal Content Area -->
    <g transform="translate(30, 70)" font-size="13">
      <!-- Welcome Line -->
      <text x="0" y="10" fill="#64748b">========================================================================</text>
      <text x="0" y="28" fill="#38bdf8" font-weight="bold">⚡ AWS Builder Center Interactive Shell v2.4.0 (Amplify Gen 2 / Node 20)</text>
      <text x="0" y="46" fill="#64748b">Type &apos;<tspan fill="#f59e0b">help</tspan>&apos; to list available commands. Try &apos;<tspan fill="#10b981">sudo hire farhan</tspan>&apos;.</text>
      <text x="0" y="64" fill="#64748b">========================================================================</text>

      <!-- Command 1: aws status -->
      <text x="0" y="95" fill="#10b981">farhan@portfolio:~$ <tspan fill="#f8fafc">aws sts get-caller-identity --output table</tspan></text>
      
      <!-- Table output -->
      <g fill="#94a3b8" font-size="11">
        <text x="0" y="115">-------------------------------------------------------------------------</text>
        <text x="0" y="130">|                           GetCallerIdentity                           |</text>
        <text x="0" y="145">=========================================================================</text>
        <text x="0" y="160">|  Account     |  UserId                 |  Arn                         |</text>
        <text x="0" y="175">|  987654321012|  AROAJ239XEMPR781:farhan|  arn:aws:iam::student:farhan |</text>
        <text x="0" y="190">-------------------------------------------------------------------------</text>
      </g>

      <!-- Command 2: skills --tech-stack -->
      <text x="0" y="220" fill="#10b981">farhan@portfolio:~$ <tspan fill="#f8fafc">portfolio skills --category cloud-native</tspan></text>
      <g fill="#cbd5e1" font-size="11">
        <text x="0" y="240"><tspan fill="#06b6d4">[+] Serverless:</tspan> AWS Lambda, API Gateway, DynamoDB, EventBridge</text>
        <text x="0" y="258"><tspan fill="#a855f7">[+] Containers:</tspan> Amazon ECS, Fargate, Docker, AWS CDK v2</text>
        <text x="0" y="276"><tspan fill="#f59e0b">[+] Generative AI:</tspan> Amazon Bedrock (Claude 3.5 Haiku/Sonnet), Strands SDK</text>
        <text x="0" y="294"><tspan fill="#ec4899">[+] Frontend Edge:</tspan> React 18, TypeScript, Tailwind, CloudFront, Amplify Gen 2</text>
      </g>

      <!-- Command 3: sudo hire farhan -->
      <text x="0" y="325" fill="#10b981">farhan@portfolio:~$ <tspan fill="#22c55e" font-weight="bold">sudo hire farhan</tspan></text>

      <!-- Execution Box / Celebration Output -->
      <g transform="translate(0, 340)">
        <rect x="0" y="0" width="1020" height="150" rx="10" fill="#042f2e" fill-opacity="0.8" stroke="#0d9488" stroke-width="1.5" />
        
        <!-- Confetti stars/sparks -->
        <text x="40" y="35" fill="#facc15" font-size="18">★</text>
        <text x="240" y="55" fill="#ec4899" font-size="14">✦</text>
        <text x="650" y="30" fill="#38bdf8" font-size="16">◆</text>
        <text x="890" y="60" fill="#a855f7" font-size="18">★</text>
        <text x="960" y="35" fill="#22c55e" font-size="14">✦</text>

        <text x="30" y="35" fill="#5eead4" font-weight="bold" font-size="14">[SUCCESS 200 OK] OFFER DISPATCHED TO TALENT ACQUISITION ENGINE!</text>
        <text x="30" y="60" fill="#ccfbf1" font-size="12">🚀 Role Match: Cloud Software Engineer / Solutions Architect Intern</text>
        <text x="30" y="80" fill="#ccfbf1" font-size="12">📧 Direct Dispatch: farhan@awsbuilder.dev | GitHub: @farhan-cloud | LinkedIn: /in/farhan-builder</text>
        <text x="30" y="102" fill="#99f6e4" font-size="11">✓ Verified Badges: AWS Certified Cloud Practitioner • Solutions Architect Associate • AI Practitioner</text>
        
        <!-- Interactive Prompt simulation -->
        <text x="30" y="130" fill="#facc15" font-size="11">✨ Thank you for the opportunity! You've unlocked the secret easter egg profile.</text>
      </g>

      <!-- Active Cursor Line -->
      <text x="0" y="515" fill="#10b981">farhan@portfolio:~$ <tspan fill="#38bdf8">portfolio contact --send</tspan> <tspan fill="#38bdf8" opacity="0.8">_</tspan></text>
      <rect x="290" y="502" width="8" height="16" fill="#38bdf8" opacity="0.9" />
    </g>
  </g>
</svg>

