<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#030712;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="aiBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="userBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadowBox">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#030712" />

  <!-- Ambient background glow -->
  <circle cx="850" cy="300" r="300" fill="#38bdf8" fill-opacity="0.06" />
  <circle cx="200" cy="500" r="250" fill="#818cf8" fill-opacity="0.05" />

  <!-- Left Sidebar: AI System Architecture & Persona Specs -->
  <g transform="translate(60, 45)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="340" height="585" rx="16" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Header -->
    <g transform="translate(24, 25)">
      <rect x="0" y="0" width="40" height="40" rx="10" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" />
      <text x="20" y="26" fill="#38bdf8" font-size="20" text-anchor="middle">🧠</text>
      
      <text x="52" y="18" fill="#ffffff" font-size="16" font-weight="bold">AI Twin Persona</text>
      <text x="52" y="34" fill="#94a3b8" font-size="11">Amazon Bedrock Powered</text>
    </g>

    <line x1="24" y1="80" x2="316" y2="80" stroke="#1e293b" />

    <!-- Model Spec Pill -->
    <g transform="translate(24, 95)">
      <rect x="0" y="0" width="292" height="32" rx="8" fill="#1e1e2f" stroke="#3730a3" />
      <circle cx="16" cy="16" r="4" fill="#818cf8" />
      <text x="28" y="20" fill="#c7d2fe" font-size="11" font-weight="bold">Model: anthropic.claude-3-5-haiku</text>
    </g>

    <!-- Context Retrieval Specs -->
    <g transform="translate(24, 145)" font-size="12">
      <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">GROUNDED KNOWLEDGE BASE</text>
      
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="292" height="55" rx="8" fill="#0b1329" stroke="#1e293b" />
        <text x="12" y="22" fill="#38bdf8" font-size="12" font-weight="bold">⚡ Education &amp; Cloud Certs</text>
        <text x="12" y="42" fill="#64748b" font-size="10">B.S. Computer Science • 3x AWS Certified</text>
      </g>

      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="292" height="55" rx="8" fill="#0b1329" stroke="#1e293b" />
        <text x="12" y="22" fill="#38bdf8" font-size="12" font-weight="bold">🛠️ Featured Repositories</text>
        <text x="12" y="42" fill="#64748b" font-size="10">Strands SRE Swarm • EcoRoute EV Map</text>
      </g>

      <g transform="translate(0, 145)">
        <rect x="0" y="0" width="292" height="55" rx="8" fill="#0b1329" stroke="#1e293b" />
        <text x="12" y="22" fill="#38bdf8" font-size="12" font-weight="bold">🛡️ Guardrail Rules</text>
        <text x="12" y="42" fill="#64748b" font-size="10">System prompt bounds: Truthful, No hallucinations</text>
      </g>
    </g>

    <!-- Telemetry Stats at bottom of panel -->
    <g transform="translate(24, 390)">
      <rect x="0" y="0" width="292" height="165" rx="12" fill="#080e1e" stroke="#1e293b" />
      <text x="16" y="25" fill="#f8fafc" font-size="12" font-weight="bold">Runtime Invocations</text>

      <text x="16" y="60" fill="#94a3b8" font-size="11">Total Bedrock Tokens:</text>
      <text x="276" y="60" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="end">14,892</text>

      <text x="16" y="88" fill="#94a3b8" font-size="11">P95 Stream TTFT:</text>
      <text x="276" y="88" fill="#10b981" font-size="12" font-weight="bold" text-anchor="end">280 ms</text>

      <text x="16" y="116" fill="#94a3b8" font-size="11">Estimated Model Cost:</text>
      <text x="276" y="116" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="end">&lt; $0.02</text>

      <text x="16" y="144" fill="#94a3b8" font-size="11">Status:</text>
      <text x="276" y="144" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="end">● Connected (us-east-1)</text>
    </g>
  </g>

  <!-- Right Chat Drawer Area -->
  <g transform="translate(430, 45)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="710" height="585" rx="16" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Chat Header -->
    <rect x="0" y="0" width="710" height="60" rx="16" fill="#0f172a" />
    <rect x="0" y="45" width="710" height="15" fill="#0f172a" />
    <line x1="0" y1="60" x2="710" y2="60" stroke="#1e293b" />

    <circle cx="35" cy="30" r="14" fill="#0284c7" />
    <text x="35" y="35" fill="#ffffff" font-size="14" text-anchor="middle">🤖</text>
    <text x="60" y="27" fill="#ffffff" font-size="14" font-weight="bold">Farhan&apos;s Digital Twin</text>
    <text x="60" y="44" fill="#10b981" font-size="10">● Ready to converse • Ask anything about technical experience</text>

    <!-- Chat Messages Stream -->
    <!-- Message 1: User Question -->
    <g transform="translate(30, 85)">
      <rect x="180" y="0" width="470" height="50" rx="14" fill="url(#userBubble)" />
      <text x="200" y="30" fill="#ffffff" font-size="12">What makes your AWS architectures stand out from other students?</text>
    </g>

    <!-- Message 2: AI Twin Response -->
    <g transform="translate(30, 150)">
      <circle cx="20" cy="20" r="14" fill="#0284c7" />
      <text x="20" y="25" fill="#ffffff" font-size="14" text-anchor="middle">🤖</text>

      <rect x="45" y="0" width="605" height="155" rx="14" fill="url(#aiBubble)" stroke="#334155" />
      <text x="65" y="28" fill="#e2e8f0" font-size="12">Three key principles define Farhan&apos;s cloud implementations:</text>
      
      <text x="65" y="55" fill="#38bdf8" font-size="12" font-weight="bold">1. True Serverless Architecture:</text>
      <text x="260" y="55" fill="#94a3b8" font-size="12">Zero-idle compute with Lambda, EventBridge, &amp; DynamoDB.</text>

      <text x="65" y="82" fill="#38bdf8" font-size="12" font-weight="bold">2. Security by Default:</text>
      <text x="205" y="82" fill="#94a3b8" font-size="12">Least-privilege IAM policies, WAF protection, and edge TLS 1.3.</text>

      <text x="65" y="109" fill="#38bdf8" font-size="12" font-weight="bold">3. Multi-Agent AI Integration:</text>
      <text x="250" y="109" fill="#94a3b8" font-size="12">Hands-on with Bedrock &amp; Strands SDK for automated operations.</text>

      <text x="65" y="136" fill="#cbd5e1" font-size="11" font-style="italic">"I don&apos;t just click in the console; every resource is codified in AWS CDK v2."</text>
    </g>

    <!-- Message 3: User Followup Question -->
    <g transform="translate(30, 325)">
      <rect x="220" y="0" width="430" height="45" rx="14" fill="url(#userBubble)" />
      <text x="240" y="28" fill="#ffffff" font-size="12">Can you tell me about the Strands SRE agent swarm you built?</text>
    </g>

    <!-- Message 4: AI Twin Response Streaming -->
    <g transform="translate(30, 385)">
      <circle cx="20" cy="20" r="14" fill="#0284c7" />
      <text x="20" y="25" fill="#ffffff" font-size="14" text-anchor="middle">🤖</text>

      <rect x="45" y="0" width="605" height="95" rx="14" fill="url(#aiBubble)" stroke="#334155" />
      <text x="65" y="26" fill="#e2e8f0" font-size="12">Farhan engineered a 4-specialist autonomous SRE swarm for cloud incident response:</text>
      <text x="65" y="50" fill="#94a3b8" font-size="11">• <tspan fill="#38bdf8" font-weight="bold">Commander</tspan> coordinates incident state &amp; Slack/Jira notifications</text>
      <text x="65" y="70" fill="#94a3b8" font-size="11">• <tspan fill="#38bdf8" font-weight="bold">Triage, Diagnostic &amp; Remediation</tspan> specialists analyze CloudWatch &amp; execute dry-runs</text>
    </g>

    <!-- Suggested Prompt Chips -->
    <g transform="translate(75, 495)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="80" y="18" fill="#94a3b8" font-size="10" text-anchor="middle">💼 View Resume Summary</text>

      <rect x="175" y="0" width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="260" y="18" fill="#94a3b8" font-size="10" text-anchor="middle">🚀 Walkthrough Projects</text>

      <rect x="360" y="0" width="180" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="450" y="18" fill="#94a3b8" font-size="10" text-anchor="middle">⚡ Why AWS for Portfolio?</text>
    </g>

    <!-- Bottom Input Box -->
    <g transform="translate(30, 532)">
      <rect x="0" y="0" width="650" height="42" rx="12" fill="#020617" stroke="#334155" />
      <text x="20" y="26" fill="#64748b" font-size="12">Ask Farhan&apos;s AI Twin anything about architecture, code, or goals...</text>
      <rect x="580" y="6" width="60" height="30" rx="8" fill="#0284c7" />
      <text x="610" y="25" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Send</text>
    </g>
  </g>
</svg>

