<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#020617;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Background Ambient Glows & Grid -->
  <circle cx="600" cy="220" r="260" fill="#06b6d4" fill-opacity="0.07" />

  <!-- Top Navbar Mockup -->
  <g transform="translate(60, 30)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="64" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" />
    
    <!-- Logo -->
    <rect x="25" y="14" width="36" height="36" rx="10" fill="#06b6d4" />
    <path d="M 43 22 L 32 38 L 54 38 Z" fill="#ffffff" />
    <text x="75" y="36" fill="#ffffff" font-size="16" font-weight="bold">Farhan <tspan fill="#06b6d4" font-family="monospace">.cloud</tspan></text>
    <text x="75" y="48" fill="#94a3b8" font-size="10">AWS Student Builder</text>

    <!-- Nav Links -->
    <text x="500" y="38" fill="#cbd5e1" font-size="12">About</text>
    <text x="560" y="38" fill="#cbd5e1" font-size="12">Skills</text>
    <text x="620" y="38" fill="#cbd5e1" font-size="12">Projects</text>
    <text x="690" y="38" fill="#cbd5e1" font-size="12">AWS Certs</text>

    <!-- Superpower Action Buttons -->
    <rect x="780" y="14" width="120" height="36" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="840" y="37" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">🤖 Ask AI Twin</text>

    <rect x="915" y="14" width="140" height="36" rx="12" fill="#06b6d4" />
    <text x="985" y="37" fill="#020617" font-size="12" font-weight="bold" text-anchor="middle">💻 Terminal CLI</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(60, 160)" text-anchor="middle">
    <!-- Status Pill -->
    <rect x="360" y="0" width="360" height="28" rx="14" fill="#083344" fill-opacity="0.6" stroke="#06b6d4" stroke-width="1" />
    <circle cx="376" cy="14" r="4" fill="#22d3ee" />
    <text x="545" y="19" fill="#67e8f9" font-size="11" font-weight="600">Deployed on AWS Amplify Hosting • Gen 2 Continuous Pipeline</text>

    <!-- Headline -->
    <text x="540" y="80" fill="#ffffff" font-size="44" font-weight="extrabold">Building Resilient Cloud Systems &amp;</text>
    <text x="540" y="135" fill="url(#cyanGrad)" font-size="44" font-weight="extrabold">Autonomous Multi-Agent AI</text>

    <!-- Subtitle -->
    <text x="540" y="180" fill="#94a3b8" font-size="16">Hi, I'm <tspan fill="#ffffff" font-weight="bold">Farhan</tspan> — student cloud architect focused on high availability,</text>
    <text x="540" y="205" fill="#94a3b8" font-size="16">event-driven serverless backends, and least-privilege AWS security design.</text>

    <!-- CTA Buttons -->
    <g transform="translate(380, 240)">
      <rect x="0" y="0" width="200" height="48" rx="16" fill="#06b6d4" />
      <text x="100" y="30" fill="#020617" font-size="13" font-weight="bold">⚡ Launch Superpower CLI</text>

      <rect x="220" y="0" width="190" height="48" rx="16" fill="#0f172a" stroke="#334155" />
      <text x="315" y="30" fill="#ffffff" font-size="13" font-weight="600">🏗️ Architecture Sandbox</text>
    </g>
  </g>

  <!-- Bottom Credential Badges -->
  <g transform="translate(140, 485)" filter="url(#shadow)">
    <!-- Badge 1: Solutions Architect -->
    <rect x="0" y="0" width="210" height="110" rx="18" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="32" fill="#f59e0b" font-size="18">🏆</text>
    <text x="20" y="60" fill="#ffffff" font-size="12" font-weight="bold">AWS Solutions Architect</text>
    <text x="20" y="78" fill="#94a3b8" font-size="10">Associate SAA-C03 (890/1000)</text>
    <text x="20" y="96" fill="#10b981" font-size="10" font-weight="bold">✓ Officially Credly Verified</text>

    <!-- Badge 2: Serverless -->
    <rect x="235" y="0" width="210" height="110" rx="18" fill="#0f172a" stroke="#1e293b" />
    <text x="255" y="32" fill="#06b6d4" font-size="18">⚡</text>
    <text x="255" y="60" fill="#ffffff" font-size="12" font-weight="bold">Serverless Native</text>
    <text x="255" y="78" fill="#94a3b8" font-size="10">Lambda, DynamoDB, SQS DLQ</text>
    <text x="255" y="96" fill="#38bdf8" font-size="10" font-weight="bold">Sub-50ms Global P99</text>

    <!-- Badge 3: Strands & GenAI -->
    <rect x="470" y="0" width="210" height="110" rx="18" fill="#0f172a" stroke="#1e293b" />
    <text x="490" y="32" fill="#a855f7" font-size="18">🤖</text>
    <text x="490" y="60" fill="#ffffff" font-size="12" font-weight="bold">Autonomous AI Swarms</text>
    <text x="490" y="78" fill="#94a3b8" font-size="10">Strands SDK + Amazon Bedrock</text>
    <text x="490" y="96" fill="#c084fc" font-size="10" font-weight="bold">Claude 3.5 Sonnet / Haiku</text>

    <!-- Badge 4: Open Source -->
    <rect x="705" y="0" width="210" height="110" rx="18" fill="#0f172a" stroke="#1e293b" />
    <text x="725" y="32" fill="#10b981" font-size="18">📦</text>
    <text x="725" y="60" fill="#ffffff" font-size="12" font-weight="bold">Open Source Builder</text>
    <text x="725" y="78" fill="#94a3b8" font-size="10">120+ GitHub Commits</text>
    <text x="725" y="96" fill="#34d399" font-size="10" font-weight="bold">3x Hackathon Finalist</text>
  </g>
</svg>

